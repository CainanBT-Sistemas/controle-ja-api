name: PostgreSQL Backup

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      retention_dry_run:
        description: "Simular a retencao sem excluir arquivos antigos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: controleja-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted PostgreSQL backup
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client, age and rclone
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16 age rclone

      - name: Create, validate, encrypt and upload backup
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          BACKUP_REMOTE_PATH: ${{ secrets.BACKUP_REMOTE_PATH }}
          RAILWAY_DB_URL: ${{ secrets.RAILWAY_DB_URL }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          RETENTION_DAYS: "90"
          RETENTION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_dry_run && 'true' || 'false' }}
        run: bash scripts/backup/postgres-backup.sh

  report-failure:
    name: Report backup failure
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open operational issue when none is active
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[OPS-004] Backup automatizado falhou";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            if (issues.some((issue) => issue.title === title)) {
              core.notice("Ja existe uma issue aberta para a falha de backup.");
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "O backup PostgreSQL da OPS-004 falhou.",
                "",
                "Verifique a execucao do workflow sem copiar secrets ou dados sensiveis para esta issue.",
                `Execucao: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });
