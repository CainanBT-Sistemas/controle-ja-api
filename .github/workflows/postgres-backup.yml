name: PostgreSQL Backup

on:
  push:
    branches:
      - dev
      - main

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      retention_dry_run:
        description: "Simular a retencao sem excluir arquivos antigos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: controleja-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted PostgreSQL backup
    if: ${{ github.ref_name == (vars.BACKUP_ACTIVE_BRANCH || 'dev') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client, age and rclone
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            age \
            rclone

          sudo install -d -m 0755 \
            /usr/share/postgresql-common/pgdg

          sudo curl \
            --fail \
            --silent \
            --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          source /etc/os-release

          printf '%s\n' \
            "Types: deb" \
            "URIs: https://apt.postgresql.org/pub/repos/apt" \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Components: main" \
            "Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null

          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            postgresql-client-18

          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Create, validate, encrypt and upload backup
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          BACKUP_REMOTE_PATH: ${{ secrets.BACKUP_REMOTE_PATH }}
          RAILWAY_DB_URL: ${{ secrets.RAILWAY_DB_URL }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          RETENTION_DAYS: "90"
          RETENTION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_dry_run && 'true' || 'false' }}
        run: bash scripts/backup/postgres-backup.sh

  report-failure:
    name: Report backup failure
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Open operational issue when none is active
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[OPS-004] Backup automatizado falhou";

            const { data: issues } =
              await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              });

            if (issues.some((issue) => issue.title === title)) {
              core.notice(
                "Ja existe uma issue aberta para a falha de backup."
              );
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "O backup PostgreSQL da OPS-004 falhou.",
                "",
                "Verifique a execucao do workflow sem copiar secrets ou dados sensiveis para esta issue.",
                `Execucao: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n")
            });