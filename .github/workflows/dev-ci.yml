name: Dev CI - API

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate-api:
    name: Validate API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Validate Maven project
        run: mvn validate

      - name: Run tests
        run: mvn test

      - name: Build application
        run: mvn clean package -DskipTests