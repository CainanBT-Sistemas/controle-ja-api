spring:
  application:
    name: controleja

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

app:
  config:
    google:
      id-token:
        audience: ${GOOGLE_CLIENT_ID}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 604800000
      refresh-expiration-ms: 86400000
    token:
      issue: controle_ja_api
    entitlements:
      tester-emails: ${TESTER_EMAILS:}
    closed-test:
      enabled: ${CLOSED_TEST_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
      status:
        http-mapping:
          down: 503
          out-of-service: 503
  health:
    defaults:
      enabled: false
    db:
      enabled: true
