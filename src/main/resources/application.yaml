spring:
  application:
    name: controleja

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

app:
  config:
    google:
      id-token:
        audience: ${GOOGLE_CLIENT_ID}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 604800000
      refresh-expiration-ms: 86400000
    token:
      issue: controle_ja_api
    closed-test:
      enabled: ${CLOSED_TEST_ENABLED:false}
    account-action:
      pepper: ${ACCOUNT_ACTION_TOKEN_PEPPER:}
      expiry-minutes: ${ACCOUNT_ACTION_EXPIRY_MINUTES:15}
      max-attempts: ${ACCOUNT_ACTION_MAX_ATTEMPTS:5}
      cooldown-seconds: ${ACCOUNT_ACTION_COOLDOWN_SECONDS:60}
      ip-window-minutes: ${ACCOUNT_ACTION_IP_WINDOW_MINUTES:15}
      ip-max-requests: ${ACCOUNT_ACTION_IP_MAX_REQUESTS:10}
      reactivation-days: ${ACCOUNT_REACTIVATION_DAYS:60}
      email-enabled: ${ACCOUNT_ACTION_EMAIL_ENABLED:false}
      sender: ${ACCOUNT_ACTION_EMAIL_SENDER:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:32}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
      status:
        http-mapping:
          down: 503
          out-of-service: 503
  health:
    defaults:
      enabled: false
    db:
      enabled: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
