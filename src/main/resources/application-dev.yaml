spring:
  datasource:
    url: ${DEV_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres_local}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:cainanbt}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 129979310679-1jvva61ptka1qulph59takl8d4g1urb4.apps.googleusercontent.com
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  config:
    google:
      id-token:
        audience: 129979310679-1jvva61ptka1qulph59takl8d4g1urb4.apps.googleusercontent.com

server:
  address: 0.0.0.0
  port: ${DEV_SERVER_PORT:8080}
