spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

app:
  config:
    google:
      id-token:
        audience: ${GOOGLE_CLIENT_ID}
    jwt:
      secret: ${JWT_SECRET}
    entitlements:
      tester-emails: ${TESTER_EMAILS}